<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Console Tabellone</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #0d0d1a;
    color: #e0e0ff;
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    padding-bottom: 2rem;
  }

  header {
    background: linear-gradient(135deg, #0b1a3a, #0d2060);
    border-bottom: 3px solid #1a5fe8;
    padding: 0.8rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.15em; color: #a0c4ff; }
  #connection-status { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: #888; }
  #status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #ff4444; box-shadow: 0 0 6px #ff4444;
    transition: background 0.3s, box-shadow 0.3s;
  }

  /* MINI SCOREBOARD */
  #mini-scoreboard {
    background: #0a0a1a;
    border: 1px solid #1a3a7a;
    border-radius: 10px;
    margin: 0.8rem;
    padding: 0.8rem;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 0.5rem;
    text-align: center;
  }
  .mini-team { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; }
  .mini-name { font-size: 0.75rem; font-weight: 600; color: #a0c4ff; letter-spacing: 0.1em; }
  .mini-score { font-size: 2.5rem; font-weight: 700; color: #fff; line-height: 1; }
  .mini-center { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
  .mini-period {
    font-size: 0.8rem; font-weight: 600; color: #1a5fe8; letter-spacing: 0.15em;
    background: rgba(26,95,232,0.15); border: 1px solid #1a5fe8;
    border-radius: 4px; padding: 0.15rem 0.5rem;
  }
  .mini-clock {
    font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.05em;
  }
  .mini-clock.stopped { color: #ff4444; }
  .mini-clock.running { color: #22c55e; }

  /* SECTIONS */
  .section {
    background: #131325; border: 1px solid #1a3a7a;
    border-radius: 10px; margin: 0.8rem; padding: 1rem;
  }
  .section-title {
    font-size: 0.8rem; font-weight: 600; color: #1a5fe8;
    letter-spacing: 0.2em; text-transform: uppercase;
    margin-bottom: 0.8rem; padding-bottom: 0.5rem;
    border-bottom: 1px solid #1a3a7a;
  }

  /* SCORE */
  .score-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  .team-score-ctrl { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
  .team-label { font-size: 0.85rem; font-weight: 600; color: #a0c4ff; letter-spacing: 0.1em; }
  .score-display {
    font-size: 2.2rem; font-weight: 700; color: #fff;
    background: #0a0a1a; border: 1px solid #1a3a7a; border-radius: 8px;
    width: 100%; text-align: center; padding: 0.3rem; line-height: 1.2;
  }
  .score-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; width: 100%; }

  /* BUTTONS */
  .btn {
    font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1.1rem;
    letter-spacing: 0.1em; border: none; border-radius: 8px;
    padding: 0.8rem 0.5rem; cursor: pointer;
    transition: transform 0.1s, opacity 0.1s;
  }
  .btn:active { transform: scale(0.94); opacity: 0.85; }
  .btn-goal { background: linear-gradient(135deg, #155a0c, #1e8c11); color: #fff; font-size: 1.4rem; border: 1px solid #2ab814; }
  .btn-minus { background: linear-gradient(135deg, #5a1010, #8c1515); color: #ffaaaa; border: 1px solid #c41818; }
  .btn-primary { background: linear-gradient(135deg, #0d2060, #1a5fe8); color: #fff; border: 1px solid #1a5fe8; }
  .btn-danger { background: linear-gradient(135deg, #5a0a0a, #aa1010); color: #ffaaaa; border: 1px solid #cc2020; }
  .btn-warning { background: linear-gradient(135deg, #4a3500, #8a6500); color: #ffc844; border: 1px solid #cc9900; }
  .btn-secondary { background: #1a1a2e; color: #a0c4ff; border: 1px solid #2a3a6a; }
  .btn-success { background: linear-gradient(135deg, #0c4020, #158040); color: #88ffbb; border: 1px solid #1ab855; }
  .btn-full { width: 100%; }
  .btn-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .btn-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }

  /* CLOCK */
  .clock-controls { display: flex; flex-direction: column; gap: 0.6rem; }
  .clock-set-row { display: flex; gap: 0.5rem; align-items: flex-end; }
  .clock-set-row > div { flex: 1; }

  /* PERIOD */
  .period-btns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.4rem; }
  .btn-period { font-size: 0.9rem; padding: 0.7rem 0.2rem; }
  .btn-period.active {
    background: linear-gradient(135deg, #0d2060, #1a5fe8) !important;
    border-color: #5a9eff !important; color: #fff !important;
    box-shadow: 0 0 12px rgba(26,95,232,0.4);
  }

  /* FORMS */
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .form-label { font-size: 0.75rem; color: #667; letter-spacing: 0.1em; margin-bottom: 0.2rem; }
  .form-input {
    background: #0a0a1a; border: 1px solid #1a3a7a; border-radius: 8px;
    color: #fff; font-family: 'Rajdhani', sans-serif;
    font-size: 1.1rem; font-weight: 600; padding: 0.6rem 0.8rem;
    outline: none; width: 100%;
  }
  .form-input:focus { border-color: #1a5fe8; }
  .form-input::placeholder { color: #444; }

  /* PENALTY LIST */
  .penalty-list { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.4rem; }
  .penalty-item {
    background: #1a0808; border: 1px solid #4a1010; border-radius: 6px;
    padding: 0.5rem 0.8rem; display: flex; justify-content: space-between; align-items: center;
  }
  .penalty-info { color: #ffaaaa; font-size: 0.9rem; }
  .penalty-time-badge { color: #ff6644; font-weight: 700; font-size: 1rem; }
  .btn-remove {
    background: #3a0808; border: 1px solid #6a1010; color: #ff6644;
    border-radius: 5px; padding: 0.2rem 0.6rem; cursor: pointer;
    font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 0.9rem;
  }

  /* TEAMS */
  .teams-form { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }

  /* DANGER */
  .danger-zone { border-color: #4a1010; }

  /* TOAST */
  #toast {
    position: fixed; bottom: 1rem; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #1a5fe8; color: #fff; border-radius: 20px;
    padding: 0.6rem 1.5rem; font-size: 0.9rem; font-weight: 600;
    letter-spacing: 0.1em; z-index: 200;
    transition: transform 0.3s ease; white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>🏒 CONSOLE TABELLONE</h1>
  <div id="connection-status">
    <div id="status-dot"></div>
    <span id="status-text">Connessione...</span>
  </div>
</header>

<div id="mini-scoreboard">
  <div class="mini-team">
    <div class="mini-name" id="mini-home-name">HOME</div>
    <div class="mini-score" id="mini-home-score">0</div>
  </div>
  <div class="mini-center">
    <div class="mini-period" id="mini-period">1°</div>
    <div class="mini-clock stopped" id="mini-clock">20:00</div>
  </div>
  <div class="mini-team">
    <div class="mini-name" id="mini-away-name">AWAY</div>
    <div class="mini-score" id="mini-away-score">0</div>
  </div>
</div>

<!-- PUNTEGGIO -->
<div class="section">
  <div class="section-title">⚽ Punteggio</div>
  <div class="score-controls">
    <div class="team-score-ctrl">
      <div class="team-label" id="ctrl-home-label">HOME</div>
      <div class="score-display" id="ctrl-home-score">0</div>
      <div class="score-btns">
        <button class="btn btn-goal" onclick="goal('home')">+GOL</button>
        <button class="btn btn-minus" onclick="adjustScore('home', -1)">−1</button>
      </div>
    </div>
    <div class="team-score-ctrl">
      <div class="team-label" id="ctrl-away-label">AWAY</div>
      <div class="score-display" id="ctrl-away-score">0</div>
      <div class="score-btns">
        <button class="btn btn-goal" onclick="goal('away')">+GOL</button>
        <button class="btn btn-minus" onclick="adjustScore('away', -1)">−1</button>
      </div>
    </div>
  </div>
</div>

<!-- CLOCK -->
<div class="section">
  <div class="section-title">⏱ Cronometro</div>
  <div class="clock-controls">
    <div class="btn-grid-3">
      <button class="btn btn-success" onclick="api('POST', '/clock/start')">▶ START</button>
      <button class="btn btn-warning" onclick="api('POST', '/clock/stop')">⏸ STOP</button>
      <button class="btn btn-secondary" onclick="api('POST', '/clock/reset')">↺ RESET</button>
    </div>
    <div class="clock-set-row">
      <div>
        <div class="form-label">IMPOSTA TEMPO (mm:ss)</div>
        <input type="text" id="clock-input" class="form-input" placeholder="es. 15:30">
      </div>
      <button class="btn btn-primary" style="padding:0.6rem 1rem;white-space:nowrap" onclick="setClock()">SET</button>
    </div>
  </div>
</div>

<!-- PERIODO -->
<div class="section">
  <div class="section-title">🏒 Periodo</div>
  <div class="period-btns">
    <button class="btn btn-secondary btn-period" id="period-btn-1" onclick="setPeriod(1)">1°</button>
    <button class="btn btn-secondary btn-period" id="period-btn-2" onclick="setPeriod(2)">2°</button>
    <button class="btn btn-secondary btn-period" id="period-btn-3" onclick="setPeriod(3)">3°</button>
    <button class="btn btn-secondary btn-period" id="period-btn-4" onclick="setPeriod(4)">OT</button>
    <button class="btn btn-secondary btn-period" id="period-btn-5" onclick="setPeriod(5)">SO</button>
  </div>
</div>

<!-- PENALITA' -->
<div class="section">
  <div class="section-title">🚫 Penalità</div>
  <div style="display:flex;flex-direction:column;gap:0.6rem">
    <div class="form-row">
      <div>
        <div class="form-label">NUMERO GIOCATORE</div>
        <input type="text" id="pen-player" class="form-input" placeholder="es. 17" maxlength="3">
      </div>
      <div>
        <div class="form-label">MINUTI</div>
        <input type="number" id="pen-minutes" class="form-input" value="2" min="1" max="10">
      </div>
    </div>
    <div class="btn-grid-2">
      <button class="btn btn-primary" onclick="addPenalty('home')">+ PEN. HOME</button>
      <button class="btn btn-primary" onclick="addPenalty('away')">+ PEN. AWAY</button>
    </div>
    <div id="penalty-list-home" class="penalty-list"></div>
    <div id="penalty-list-away" class="penalty-list"></div>
  </div>
</div>

<!-- NOMI SQUADRE -->
<div class="section">
  <div class="section-title">✏️ Nomi Squadre</div>
  <div class="teams-form">
    <div>
      <div class="form-label">SQUADRA HOME</div>
      <input type="text" id="home-team-input" class="form-input" placeholder="HOME" maxlength="12">
    </div>
    <div>
      <div class="form-label">SQUADRA AWAY</div>
      <input type="text" id="away-team-input" class="form-input" placeholder="AWAY" maxlength="12">
    </div>
  </div>
  <div style="margin-top:0.6rem">
    <div class="form-label">NOME TORNEO</div>
    <div style="display:flex;gap:0.5rem">
      <input type="text" id="tournament-input" class="form-input" placeholder="es. SERIE A" maxlength="30">
      <button class="btn btn-primary" style="padding:0.6rem 1rem" onclick="setTournament()">OK</button>
    </div>
  </div>
  <button class="btn btn-primary btn-full" style="margin-top:0.6rem" onclick="setTeams()">AGGIORNA NOMI</button>
</div>

<!-- DANGER ZONE -->
<div class="section danger-zone">
  <div class="section-title" style="color:#ff4444">⚠️ Operazioni Pericolose</div>
  <button class="btn btn-danger btn-full" onclick="confirmReset()">🔄 RESET PARTITA COMPLETO</button>
</div>

<div id="toast">OK</div>

<script>
  let currentState = null;
  let evtSource = null;

  async function api(method, path, body) {
    try {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch('/api/scoreboard' + path, opts);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      showToast('✓');
    } catch(e) {
      showToast('ERRORE: ' + e.message, '#cc2200');
    }
  }

  function showToast(msg, color) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = color || '#1a5fe8';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1200);
  }

  function goal(team) { api('POST', '/goal/' + team); }

  function adjustScore(team, delta) {
    if (!currentState) return;
    const cur = team === 'home' ? currentState.homeScore : currentState.awayScore;
    api('POST', '/score/' + team + '/' + Math.max(0, cur + delta));
  }

  function setPeriod(p) { api('POST', '/period/' + p); }

  function setClock() {
    const val = document.getElementById('clock-input').value.trim();
    let seconds;
    if (val.includes(':')) {
      const [m, s] = val.split(':');
      seconds = parseInt(m) * 60 + parseInt(s);
    } else {
      seconds = parseInt(val);
    }
    if (!isNaN(seconds) && seconds >= 0) {
      api('POST', '/clock/set/' + seconds);
      document.getElementById('clock-input').value = '';
    } else {
      showToast('FORMATO NON VALIDO (usa mm:ss)', '#cc6600');
    }
  }

  function addPenalty(team) {
    const player = document.getElementById('pen-player').value.trim();
    const minutes = parseInt(document.getElementById('pen-minutes').value) || 2;
    if (!player) { showToast('INSERISCI NUMERO GIOCATORE', '#cc6600'); return; }
    api('POST', '/penalty/' + team, { playerNumber: player, minutes });
    document.getElementById('pen-player').value = '';
  }

  function removePenalty(team, index) { api('DELETE', '/penalty/' + team + '/' + index); }

  function setTeams() {
    const home = document.getElementById('home-team-input').value.trim();
    const away = document.getElementById('away-team-input').value.trim();
    api('POST', '/teams', { home, away });
  }

  function setTournament() {
    const name = document.getElementById('tournament-input').value.trim();
    if (name) api('POST', '/tournament', { name });
  }

  function confirmReset() {
    if (confirm('Sei sicuro di voler resettare tutta la partita?')) api('POST', '/reset');
  }

  function formatTime(s) {
    if (s <= 0) return '00:00';
    return String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
  }

  function periodLabel(p) {
    return {1:'1°', 2:'2°', 3:'3°', 4:'OT', 5:'SO'}[p] || p + '°';
  }

  function updateUI(state) {
    currentState = state;

    document.getElementById('mini-home-name').textContent = state.homeTeam;
    document.getElementById('mini-away-name').textContent = state.awayTeam;
    document.getElementById('mini-home-score').textContent = state.homeScore;
    document.getElementById('mini-away-score').textContent = state.awayScore;
    document.getElementById('mini-period').textContent = periodLabel(state.period);

    const clockEl = document.getElementById('mini-clock');
    clockEl.textContent = state.period === 5 ? 'SO' : formatTime(state.clockSeconds);
    clockEl.className = 'mini-clock ' + (state.clockRunning ? 'running' : 'stopped');

    document.getElementById('ctrl-home-label').textContent = state.homeTeam;
    document.getElementById('ctrl-away-label').textContent = state.awayTeam;
    document.getElementById('ctrl-home-score').textContent = state.homeScore;
    document.getElementById('ctrl-away-score').textContent = state.awayScore;

    for (let i = 1; i <= 5; i++) {
      const btn = document.getElementById('period-btn-' + i);
      if (btn) btn.classList.toggle('active', state.period === i);
    }

    renderPenaltyList('penalty-list-home', 'home', state.homePenalties, state.homeTeam);
    renderPenaltyList('penalty-list-away', 'away', state.awayPenalties, state.awayTeam);
  }

  function renderPenaltyList(containerId, team, penalties, teamName) {
    const el = document.getElementById(containerId);
    el.innerHTML = '';
    (penalties || []).forEach((p, i) => {
      const item = document.createElement('div');
      item.className = 'penalty-item';
      item.innerHTML = `
        <div class="penalty-info">${teamName} — #${p.playerNumber}</div>
        <div class="penalty-time-badge">${formatTime(p.remainingSeconds)}</div>
        <button class="btn-remove" onclick="removePenalty('${team}', ${i})">✕</button>
      `;
      el.appendChild(item);
    });
  }

  function connect() {
    if (evtSource) evtSource.close();
    evtSource = new EventSource('/api/scoreboard/events');

    evtSource.addEventListener('state', e => {
      document.getElementById('status-dot').style.cssText = 'background:#22c55e;box-shadow:0 0 6px #22c55e';
      document.getElementById('status-text').textContent = 'Connesso';
      updateUI(JSON.parse(e.data));
    });

    evtSource.onerror = () => {
      document.getElementById('status-dot').style.cssText = 'background:#ff4444;box-shadow:0 0 6px #ff4444';
      document.getElementById('status-text').textContent = 'Disconnesso';
      evtSource.close();
      setTimeout(connect, 3000);
    };
  }

  connect();
</script>
</body>
</html>
